name: Generate severe thunderstorm maps

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/generate-maps.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: severe-thunderstorm-maps
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate maps
        env:
          BOM_WARNING_GEOJSON_URL: ${{ secrets.BOM_WARNING_GEOJSON_URL }}
          BOM_RADAR_WMS_URL: ${{ secrets.BOM_RADAR_WMS_URL }}
          BOM_RADAR_WMS_LAYER: ${{ secrets.BOM_RADAR_WMS_LAYER }}
          BOM_RADAR_WMS_VERSION: ${{ secrets.BOM_RADAR_WMS_VERSION }}
        run: python -m src.generate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
