name: Generate severe thunderstorm maps

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "config.js"
      - ".nojekyll"
      - "requirements.txt"
      - ".github/workflows/generate-maps.yml"

permissions:
  contents: write

concurrency:
  group: severe-thunderstorm-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Generate maps
        id: generate
        continue-on-error: true
        env:
          BOM_WARNING_GEOJSON_URL: ${{ secrets.BOM_WARNING_GEOJSON_URL }}
          BOM_RADAR_WMS_URL: ${{ secrets.BOM_RADAR_WMS_URL }}
          BOM_RADAR_WMS_LAYER: ${{ secrets.BOM_RADAR_WMS_LAYER }}
          BOM_RADAR_WMS_VERSION: ${{ secrets.BOM_RADAR_WMS_VERSION }}
          BOM_RADAR_WMS_STYLE: ${{ secrets.BOM_RADAR_WMS_STYLE }}
          BOM_RADAR_WMS_USERNAME: ${{ secrets.BOM_RADAR_WMS_USERNAME }}
          BOM_RADAR_WMS_PASSWORD: ${{ secrets.BOM_RADAR_WMS_PASSWORD }}
        run: python -m src.generate

      - name: Show generation manifest
        if: always()
        run: |
          if [ -f generated/manifest.json ]; then
            cat generated/manifest.json
          fi

      - name: Publish latest generated output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated
          if git diff --cached --quiet; then
            echo "No generated output changes to publish."
          else
            git commit -m "Update generated warning maps"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Fail after publishing source error
        if: steps.generate.outcome == 'failure'
        run: |
          echo "Generation reported an operational source error. The error manifest has been published to prevent stale data being shown."
          exit 1
