name: Check BOM national radar mosaic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/check_national_radar.py"
      - ".github/workflows/check-national-radar.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Check national radar sources
        run: python -m src.check_national_radar

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bom-national-radar-diagnostics
          path: diagnostics/national-radar
          if-no-files-found: warn
          retention-days: 7
